  rockliz:
  - bugfix: Infernal now uses ,z to avoid conflicting with Hammerholdian's ,h shortcut.
  zeroisthebiggay:
  - balance: Removed the fifty-fifty when bumping someone on fire to avoid getting
      lit on fire.
  - balance: You need more than two firestacks to halve and pass them to another person,
      making it so you can't infinitely pass firestacks, e.g. (10 / 2 = 5 / 2 = 2.5
      / 2 = 1.25 / 2 = 0.625 / 2 = 0.31... etc) If you are below two firestacks, they
      just won't pass when you bump into someone.
  - balance: If someone is lying down, they can't ignite you by bumping into you.
      You also step over them if they're on fire and you walk over them, avoiding
      getting ignited. Sprinting over their body will still ignite you however.
  - refactor: Swapped around how the examine block is formatted, putting the headshot
      & supplementary buttons / info at the bottom. You can toggle this in the toggles
      menu.
  - balance: Makes medical EXP scale with wound severity and the time spent sewing.
  - rscadd: the clap once emote
  - rscadd: the slow clap emote
  zoktiik:
  - bugfix: Fixes some material duplication exploits that involve scissors refunding
      more material than the item cost to make.
2026-09-08:
  JustMeTheIInd:
  - rscadd: Tanto to Ruma-Clan Gun-in's backpack
  SillyMoff:
  - qol: Now druids can sanctify trees on DT and dont drops all clothes in wildshape.
  UntoldTactics:
  - rscadd: New light-armor chainmail-esque option for Black Oak's Ranger, new steel
      elven dagger for Black Oak mercenaries. New light armor variant of the woad
      elven helm.
  - rscdel: Elven sallet is removed.
  - balance: Black Oak Pariah has been rebalanced with a more fitting stat distribution.
      Their vicious mockery spell has been replaced with darkvision. Pariah climbing
      skill from journeyman -> expert. Pariah sewing skill from none -> apprentice.
  - balance: Black oak classes have been given the woodwalker trait.
  - balance: Black oak mercenaries are given a unique padded gambeson & leather bracers.
  - balance: Unique woad armor items fireproofed + some have had their integrity increased
      slightly.
  - balance: Black oak classes have carpentry increased from apprentice -> journeyman
      to allow for self-repair of their unique woad armor items.
  - balance: Elven swordspear has had its weapon sharpenss increased from 150 -> 200.
      It has also been given a superior peel intent (requiring 4 to peel instead of
      5)
  - balance: Elven curveblade has had its blade sharpness increased from 300 -> 350.
  - balance: Elven longsword sharpness increased from 280 -> 330.
  - balance: Elven shortsword has had its weapon defense changed from 4 -> 9, its
      integrity changed from 150 -> 200 and its sharpness/blade integrity changed
      from 200 -> 300
  - balance: Elven saber has had its weapon defense decreased from 9 -> 7. It is also
      one of the few elvish weapons to not recieve a sharpness increase.
  - balance: Elven weapons are more expensive in the merchants silverface, now.
  - image: New sprite for the steppesman fur robes, old sprite now utilized by Black
      Oak mercenaries gambeson. New icons for the elven barbutes, including colorable
      details for the wings and nasal guard!
  - refactor: Woad armor now uses the ARMOR_BLACKOAK define, rather than lists. Name
      of unique black oak foreigner-check trait redone.
  - balance: Iconoclast flail skill increased from expert -> master
  Yuckuza:
  - rscadd: Disciple reworked, +9 weighted statspread with 3 distinct loadout options
      for pure unarmed, unarmed weapons, and quarterstaffs.
  - rscadd: Disciples now get TRAIT_CICERONE and journeyman cooking, allowing them
      to pursue the time-honored tradition of monastic beer brewing. Additionally,
      alcoholic disciples get TRAIT_DRUNK_HEALING.
  - rscadd: added TRAIT_WEAPONLESS, a less strict version of TRAIT_CHUNKY_FINGERS
      which allows tool use but prevents the offensive or defensive use of rogueweapon/
      class items. Additionally, var/is_tool has been added to the rogueweapon/ parent
      item.
  - rscdel: Removed katar and knuckleduster as distinct loadout options from disciple.
      Now part of the pugilist loadout.
  - balance: Disciple skin armor changed to LEATHER_STUDDED. Layman's terms, it's
      not just a worse version of the virtue regenerating skin anymore.
  - rscadd: Ported golden armor from Azure Peak. Armor that protects against everything
      but with a dreadfully low integrity that is irreparable and unenchantable.
  - rscadd: Ported the golden mace, sword, and shield from Azure Peak. These weapons
      have high force and protective values but possess dreadfully low integrity that
      is irreparable and unenchantable.
  - rscadd: Ported the decorated axe, decorated silver khadga, and decorated silver
      mace. These 3 weapons of Naledi origin are functionally identical to their undecorated
      steel and silver counterparts, save for a higher sell price.
  - code_imp: Added var/unenchantable, a Boolean item var that prevents enchanting
      scrolls from being used on items with it set to TRUE.
