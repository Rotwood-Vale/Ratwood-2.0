2026-09-07:
  Arturlang:
  - bugfix: rebel team datum making constant timers
  Yuckuza:
  - rscadd: Added Gronnic Patron list, a subtype of inhumen that also includes Abyssor
      and Dendor.
  - rscadd: "Gronnic roles (Atgervi, Fjall J\xE1rnkl\xE6ddur, and Gronn Itinerant)\
