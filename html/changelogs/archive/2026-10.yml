  - bugfix: joining as jester will no longer break joining as a advclass
  SirSwagmeyer:
  - balance: Graggarite miracles now use EYES instead of a HEART to revive their targets.
  Xander3359:
  - bugfix: The throat no longer tells you how to set laws twice, or lie to you about
      being able to ascend when that's not a thing.
  chemistrymain3:
  - rscadd: Fixes no-thirst traits still letting you be thirsty.
  coffeecoffeecoffee:
  - balance: returns a little Cleave to greatswords in the form of making Cleave intent
      good
  john-pawson:
  - rscadd: Added two new states of sleep depravation, Fatigued and Exhausted, they
      slow you down and lower your stamina regeneration if you stay awake for more
      than one day
  - rscadd: Acorn coffee and baths need more quantity and time to remove the more
      advanced states of sleep depravation
  - rscadd: Regular coffee and tea are now able to remove sleep depravation
  - balance: Being very sleep deprived makes it easier to fall asleep, at Fatigued
      meaning less time lying down on a bed, and at Exhausted meaning you can sleep
      with your armor on
  - balance: Now that there's three sleep depravation states, you can spend 3 days
      without sleep and not miss out on skill points and inspirations
  - bugfix: People on lux or unremovable armor can now sleep while wearing it, as
      long as they remove any removable armor first.
  - qol: Sleeping on beds now takes 3 seconds less
  mushy:
  - bugfix: TRAIT_MAGEARMOR will now properly regenerate.
