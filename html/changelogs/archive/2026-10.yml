2026-10-03:
  EvenInDeathIStillServe:
  - rscadd: Opening a package containing explosives will detonate its payload on the
      spot.
  - rscadd: Using a knife to open a package has a mere 20% chance to detonate any
      explosive within.
  IronDragoon:
  - bugfix: fixed the 'secrets of the throat' command to not be incorrect in the info
      it gives
  KurobaKetsukane:
  - rscadd: Grenzelhoft, Gronn, Otava and Naledi ships have a rare chance to carry
      a Ring of Vitality, Courage, Wisdom or Swiftness.
  - rscadd: Kazengun ships sell wooden and ebony puzzle-boxes, with a rare chance
      of a royal puzzle-box.
  - qol: Rare ship cargo is marked "(rare)" in the Harbor tab's realm list.
  - balance: Royal puzzle-boxes can be retried after a failed attempt, but crumble
      to dust once solved.
  - code_imp: Supply packs have a ship_chance var for cargo that only shows up on
      some ships.
  MarioTheShiba:
  - rscadd: The Soldier of Future
  Yuckuza:
  - balance: Magician's Brick spell power scaling is now curved; int deviation both
      above and below 10 buffs the bricks' force. (i.e. 1 int & 19 int both = +9 brick)
  chemistrymain3:
  - rscadd: Mage summons now inform you who the summoner is and what mob is being
      bound.
  - rscadd: Pestran divine bolt now removes medicine in you.
  - rscadd: Teacups and other cookware can be sold again.
  ophaq:
  - qol: Implemented a clear search 'X' button to the crafting menu's search bar.
  wikimody:
  - balance: stamina poison and its strong version no longer metabolise near instantly,
      and shoudl be much more effective when used
  zeroisthebiggay:
  - bugfix: Fixed the unholy grasp miracle not cleansing its debuff when you remove
      the net.
  - balance: Reworked the unholy grasp miracle. It now just summons a net made of
      gore in your hands that will splatter into blood if you miss it, and can't be
      reused, rather than shooting a projectile.
  - balance: The unholy grasp miracle loses its knockdown capabilities.
  - sound: Added throw and attach sound effects to nets.
