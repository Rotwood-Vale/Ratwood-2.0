  - rscadd: Heretic Monk wretch class, 1 slot.
  ophaq:
  - rscadd: Adds stonebeard reserve and butterhairs to brewing recipes. Dwarves only.
      They require a mix of grains. Butterhairs requires butter (who would've guessed)
      while stonebeard requires some potato cuts. Increased their booze powers too.
      Butterhairs is also buttery colored now.
  - qol: Adjusts dwarven drunken healing from 0.2 -> 0.6!
  - rscadd: Adds in dwarven armor and weapon recipes for smithing. They are EXPENSIVE!
      Dwarf only, no books. You gotta be a dwarf to make them (and wear them, I'm
      pretty sure).
  - bugfix: Fixes several loadout issues with dwarven mercenaries and gave them a
      great weapon strap if they choose grand mace. Both classes have increased smithing
      levels to account for recent changes. Dwarven smith is more of an actual smith
      now than some subpar one.
  - bugfix: Fixes onmob dwarven gauntlets to actually show. Adjusted dwarven smith
      helmet a pixel.
  - rscadd: Removes underdweller from mercenary classes and moved it to race exclusive
      class for adventurers. Adjusted their loadout accordingly so they are not a
      mercenary anymore.
  - qol: Gives ranger warden a sheath for their seax. No more unprotected seax on
      my watch.
  - qol: Forester gets a warden seax instead of a hunting knife.
  - rscadd: Foresters now get unique armor that is based off the ranger one. It has
      slightly more durability and plate stats. Can be upgraded to be like a cuirass.
  - rscadd: Foresters can choose between an axe or sword now. They get a cool steel
      messer as their primary weapon with an iron shield if they pick swords. Expert
      in swords or expert in axes. Your choice.
  - balance: Bumped shield skill up from apprentice to journeyman.
  yupup123:
  - bugfix: Fixes the subclass preview menu for some classes missing theirs (like
      suitor and refugee).
  zoktiik:
  - qol: Added a new "Disable Red Flashes" toggle that prevents the game from showing
      you red or white "flash" overlays, i.e. from pain, combat, sparks. This is not
      foolproof, but should affect the vast majority of cases.
  - qol: 'Pain overlay for "Disable Red Flashes" ON: The flashes of pain you get on-screen
      are replaced with a more "static" red-tinted overlay. This may get replaced
      in the future.'
  - qol: '"Disable Red Flashes" ON: Prolonged bright flashing effects, such as those
      from explosions and miracles, are changed to be fade-from-black instead. You
      will receive a small chat message indicating the momentary blindness.'
  - bugfix: 'Fix for when "Disable Red Flashes" is OFF: The small blinking painflash
      that used to begin >40% pain, and persisted until you fully healed (<5% pain)
      now appropriately clears when below 40% pain.'
  - code_imp: Added a new wrapper proc fullscreen_redflash that checks the new no_redflash
      preference, and returns the exact same thing flash_fullscreen does (or null
      if flashes are disabled). This way your code can check if the prefs blocked
      it.
