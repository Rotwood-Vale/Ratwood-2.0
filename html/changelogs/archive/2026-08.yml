2026-08-01:
  Arturlang:
  - bugfix: language adding and removal is now source-based, which means if you knew
      zizite's cant before becoming a zombie, deconversion won't remove it
  IronDragoon:
  - sound: changed sound for footsteps on sand tiles
  KeberosNihilus:
  - rscadd: Arcyne Blindness - A variant of Blindness that scales on Arcane skill.
      Longer CD, requires a Naledian psycross to use.
  - bugfix: Adjusted some text regarding the Pontifex. Makes some of what they need
      clearer and it should read better.
  - balance: Pontifex now has 4 Spellpoints but still only T1 spells.
  - balance: Pontifex no longer has Ensnare by default.
  - balance: Pontifex now has 4 'Paths' (subclasses) to choose from.
  - rscadd: Path of War - Air Blade (sidegrade to Arcane Bolt) and Enchant Weapon.
      Enchant Weapon can't be used on your Push Dagger, but is deadly if applied to
      a pair of knuckles.
  - rscadd: Path of Control - Ensnare and Greater Forcewall. Heavy focus on CC and
      battlefield control.
  - rscadd: Path of Shadows - Lesser Knock, Invisibility, and Arcane Blindness. Heavy
      focus on trickery and shadows.
  - rscadd: Path of Survival - Increases your Medicine, Cooking, Athletics, and Swimming
      skills. Also gives you Secular Diagnosis. Sovl and lets you bodyguard or run
      around like a punch-dagger wielding maniac better.
  MickDick1:
  - rscadd: New machine for managing prisoner sentencing/quota/variables
  - code_imp: Added a multiplier to the saltmine tracking machine that increases over
      time
  - rscadd: Nervemaster now gets reports on prisoners in the mine
  PPooch:
  - bugfix: Anastasis spell icon cooldown should now behave as expected.
  Shadow-Quill:
  - admin: The prompt that appears when adjusting a player's PQ will no longer show
      the "allowed adjustment range" of -20 to 20 if you have the right permission
      to ignore that requirement anyways.
  - qol: Necra's Sight now asks which marker to drop if you exceed your limit, including
      choosing to forget none and cancelling the addition of the new object.
  UntoldTactics:
  - qol: Janissary Jezail sub-class now has the fusilier trait.
  - balance: Janissary Jezail sub-class now starts with light armor instead of janissary
      medium maille.
  - balance: Fine babouche now matches the integrity value of heavy leather boots.
  howtoretard2:
  - balance: Changed prices for some of items in Pioneer's Hoardmaster shop
  kimesik:
  - balance: CON influence on bleedrate reduced by half (5% per point). Its cap has
      been raised to 20.
