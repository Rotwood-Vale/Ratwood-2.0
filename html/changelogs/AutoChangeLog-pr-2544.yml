author: "Yuckuza"
delete-after: True
changes:
  - rscadd: "Added 4 new axes, bronze war axe, bronze greataxe, bronze double-headed handaxe, and the dolabra."
  - rscadd: "Added two new shields, bronze hoplon shield and hoplon greatshield. No longer locked behind Gilbranze. Hoplon shield and greatshield are uniquely very heavy, requiring much higher minstr than other shields, but gain the ability to daze intent AND have very high passive projectile blocking."
  - rscadd: "Added broadswords, longsword sidegrade with slower attacks focused on chopping and slashing rather than nimble peeling/thrusting. Comes in iron, bronze, and steel."
  - rscadd: "Added new bronze combat knife, the sydarmme, also gave bronze knife a unique icon."
  - rscadd: "New blunt weapons: Bronze flail, bronze warclubs (bronze variant of warhammers), a unique sprite for the bronze mace, and a steel variant of the iron war flail."
  - rscadd: "New winged bronze spear and new sprite for the existing bronze spear. Click with cloth to add a banner!"
  - rscadd: "New bronze projectiles. Focused on faster projectile speed and high damage, but far, far less penetration power. Comes in bronze bolts, arrows, and javelins. Additionally, bronze sling bullets now have unique icons."
  - rscadd: "Added Kopis, a bronze variant/upgrade of the peasant maciejowski that exchanges peel for a thrust."
  - rscadd: "Added bronze kopesh and bronze great kopesh, which are saber and kriegmesser analogs, respectively."
  - rscadd: "Bronze arming sword and gladius now have new sprites; gladius also now has a decorated variant."
  - rscadd: "Added bronze makhaira, a bronze variant of the one-handed messer."
  - rscadd: "Added the arbelos, a gladiatorial bronze axe-gauntlet focused on unarmed chopping as a slower sidegrade to Katar's cut-and-thrust focus."
  - rscadd: "3 new greatflails. Steel greatflail, silver greatflail, and blacksteel greatflail with a unique weapon special."
  - balance: "Gilded flail now has the new greatflail swing special"
  - rscadd: "Merchant goldface and smithy silverface now have bronze weapon catalog. Steel and iron weapon catalogs also updated with broadswords, greatfails, and some other misc. existing weapons for parity with AP."
  - bugfix: "Bronze cookware added by #1821 now have recipes, meaning they are no longer unobtainable"
  - balance: "Blacksteel shield coverage increased to 85 so as not to be outcompeted by hoplon greatshield, and its ancient counterpart."
  - image: "Intent icons split out to dedicated rogueintents.dmi, rather than being lumped into roguehud.dmi"
  - image: "Copper pitchfork no longer wired to a nonexistence iconstate in the wrong dmi file"
  - image: "Bronze katar changed to bronze pata, unique icon but otherwise identical to prior katar"
  - image: "crossbow and saturelle no longer use placeholder sprites; ghost role skeletons now have gilbranze crossbow"
  - image: "baothan ritual whip no longer uses a placeholder sprite"
  - image: "Shotel icons updated, far less"
  - image: "some minor icon reorganizing. Shotel icons live in swords64.dmi. Mauls and greatflails in blunt64.dmi."