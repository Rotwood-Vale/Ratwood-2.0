author: "john-pawson"
delete-after: True
changes:
  - rscadd: "Added two new states of sleep depravation, Fatigued and Exhausted, they slow you down and lower your stamina regeneration if you stay awake for more than one day"
  - rscadd: "Acorn coffee and baths need more quantity and time to remove the more advanced states of sleep depravation"
  - rscadd: "Regular coffee and tea are now able to remove sleep depravation"
  - balance: "Being very sleep deprived makes it easier to fall asleep, at Fatigued meaning less time lying down on a bed, and at Exhausted meaning you can sleep with your armor on"
  - balance: "Now that there's three sleep depravation states, you can spend 3 days without sleep and not miss out on skill points and inspirations"
  - bugfix: "People on lux or unremovable armor can now sleep while wearing it, as long as they remove any removable armor first."
  - qol: "Sleeping on beds now takes 3 seconds less"