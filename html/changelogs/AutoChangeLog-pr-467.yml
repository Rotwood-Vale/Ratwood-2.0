author: "mypingishuge"
delete-after: True
changes:
  - bugfix: "Restored ammunition loading for repairable bows and slings, including loading through quivers."
  - bugfix: "Prefilled and manually inserted ammunition is properly contained in quivers and pouches. Rejected loads retain their ammunition, and hotkeys ignore rounds outside their container."
  - bugfix: "Corrected loose-stone loading, unloading and consumption in slings."
  - bugfix: "Crossbows support normal repair interactions, and invalid launchers avoid missing-magazine chambering errors."