author: "trueroguan"
delete-after: True
changes:
  - bugfix: "Transfix no longer permanently gets harder to resist every time you cast it on someone in combat mode."
  - bugfix: "Obfuscate's stealth powers now grant real invisibility - NPCs can no longer see and attack you while cloaked."
  - bugfix: "Kicking and pickpocketing now break your invisibility, same as other attacks already did."
  - balance: "Potence's punch damage bonus now scales 3x per level; higher tiers grant extra strength-related traits."
  - balance: "Celerity's higher tiers grant Leaper and Expert Dodger, with a visible warning when they trigger."
  - balance: "Scorpion's Touch (Quietus) now requires an actual bleeding wound to inflict its debuff, scaled by Blood Magic skill, instead of applying on any touch."
  - balance: "Successfully Diablerizing a vampire now grants their full lifetime Research Points, not just their unspent pool."
  - qol: "Phantom Speaker lets you choose which language to project your voice in."
  - code_imp: "Extracted a shared vampire-domination-immunity check used by Transfix and Obfuscate."