author: "hugmeorelse"
delete-after: True
changes:
  - bugfix: "The headless no longer burns or teleports players it isn't actually holding."
  - bugfix: "Players swallowed by a headless are no longer deleted if it despawns."
  - bugfix: "A headless no longer chews on whoever is in its stomach, and will go after other targets instead."
  - balance: "Being swallowed by a headless is much more survivable, but the headless will now turn on whoever is trying to rescue you."
  - bugfix: "Biting, chewing and drinking blood now break invisibility."
  - bugfix: "Charging through a door now breaks invisibility."
  - code_imp: "Removed a duplicate bite grab definition that SEEMS to be overshadowing the old one."
  - refactor: "Invisibility breaking is now handled in one place."