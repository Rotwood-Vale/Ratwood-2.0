author: "AnnikaRU"
delete-after: True
changes:
  - balance: "Engineer loses Fusilier, Alchemy Expert and is locked to journeyman in all smithing skills"
  - balance: "Engineer's stats were reduced to an overall 7 statspread"
  - balance: "Smith's stats were reduced to an overall 7 statspread"
  - balance: "Engineer loses skills across the board, including firearms as it is no longer required."
  - balance: "Engineer loses ward and one minor spell choice, being locked to battlewardry and artifice"
  - balance: "Cannon was made more expensive to prevent mass cannon deployments"
  - qol: "guild blacksmith was given basic carpentry and masonry as well as journeyman mining"
  - qol: "long dolabra's were changed to be a pickaxe subtype instead of axe still requiring axe skill"
  - qol: "steam shield no longer makes the user drop the shield when activating it and is cheaper to produce"
  - qol: "Engineer now receives master in masonry and carpentry"
  - qol: "bombard shrapnel charge now deals massive armor damage to anyone in its explosion radius and shredding unarmored people going from 20 AP to medium penetration and 5 damage to 110"
  - bugfix: "Planks now properly stack up to 20"
  - bugfix: "Engineer is now given their golden spectacles in their backpack to prevent a bad eyesight overwrite"
  - bugfix: "Rotational Machinery, Windmill, Autosmither, and Infernal forge now drop the items needed to craft them instead of randomized, autosmither no longer drops example cogs"