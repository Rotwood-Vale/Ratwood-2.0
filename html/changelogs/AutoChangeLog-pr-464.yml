author: "mypingishuge"
delete-after: True
changes:
  - bugfix: "Class-selection windows now load their intended fonts directly from the game."
  - rscadd: "Emote boxes and Say starting with * or @ now show a green typing bubble, including live updates in the new Say popup that stretches automatically for long say messages."
  - bugfix: "Closing an older chat popup no longer clears a newer typing bubble."
  - rscadd: "Otherwise silent emotes and normal custom emotes play the Talk cue for visible nearby listeners, with a saved Hear Emote Sent Sound toggle."
  - rscadd: "Loadout item colors can use a custom color picker."
  - rscadd: "Added a front-facing Lips head marking."
  - rscadd: "Added an Improvised Surgery Saw loadout option for 1 point."
  - balance: "Milk provides twice as much nutrition and can be chosen as a favorite drink."
  - bugfix: "Milk leaks caused by rubbing now notify nearby players at the appropriate normal or subtle range."
  - bugfix: "Bows and slings accept hits and hammer repairs; repairable ranged weapons survive ordinary breakage on the ground."
  - bugfix: "Twirl visuals are included in the foreground body used for field-of-view rendering, while preserving the normal foreground/background hand positions."
  - rscadd: "Tailmaw customization can choose its fluid: Default, Emberwine or Honey."
  - qol: "Chairs no longer topple when someone walks through them."
  - balance: "Increased Rookie slots from 1 to 4; Smollhill keeps the role disabled."