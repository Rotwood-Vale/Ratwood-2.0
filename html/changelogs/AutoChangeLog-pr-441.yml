changes:
  - balance: "Non-utility arcane spells have a 1.5-second minimum cast time after reductions; minor utility spells, Lesser Shapeshift and Magician’s Brick retain their existing casting behavior."
  - balance: "Blink and Shadowstep cannot be cast while grabbed."
  - balance: "Repel and Repulse drag you along when they knock back the person pulling you."