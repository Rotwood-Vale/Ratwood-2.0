author: "UntoldTactics"
delete-after: True
changes:
  - rscadd: "New light-armor chainmail-esque option for Black Oak's Ranger, new steel elven dagger for Black Oak mercenaries. New light armor variant of the woad elven helm."
  - rscdel: "Elven sallet is removed."
  - balance: "Black Oak Pariah has been rebalanced with a more fitting stat distribution. Their vicious mockery spell has been replaced with darkvision. Pariah climbing skill from journeyman -> expert. Pariah sewing skill from none -> apprentice."
  - balance: "Black oak classes have been given the woodwalker trait."
  - balance: "Black oak mercenaries are given a unique padded gambeson & leather bracers."
  - balance: "Unique woad armor items fireproofed + some have had their integrity increased slightly."
  - balance: "Black oak classes have carpentry increased from apprentice -> journeyman to allow for self-repair of their unique woad armor items."
  - balance: "Elven swordspear has had its weapon sharpenss increased from 150 -> 200. It has also been given a superior peel intent (requiring 4 to peel instead of 5)"
  - balance: "Elven curveblade has had its blade sharpness increased from 300 -> 350."
  - balance: "Elven longsword sharpness increased from 280 -> 330."
  - balance: "Elven shortsword has had its weapon defense changed from 4 -> 9, its integrity changed from 150 -> 200 and its sharpness/blade integrity changed from 200 -> 300"
  - balance: "Elven saber has had its weapon defense decreased from 9 -> 7. It is also one of the few elvish weapons to not recieve a sharpness increase."
  - balance: "Elven weapons are more expensive in the merchants silverface, now."
  - image: "New sprite for the steppesman fur robes, old sprite now utilized by Black Oak mercenaries gambeson. New icons for the elven barbutes, including colorable details for the wings and nasal guard!"
  - refactor: "Woad armor now uses the ARMOR_BLACKOAK define, rather than lists. Name of unique black oak foreigner-check trait redone."