author: "Yuckuza"
delete-after: True
changes:
  - rscadd: "Ported cleave AOE weapon intents from Azure Peak"
  - balance: "Greatsword reworked - Removed Rend & Bash on gripped intents, gains Cleave and Sweep AOE intents"
  - balance: "Executioner's Sword gains Cleave and Sweep at 1.2 damfactor. No longer heavy balance."
  - rscadd: "Berserker sword, a MUCH lesser daemonslayer guts sword. In the Executioner sword subtype. Loses peel in exchange for a unique smash intent that does knockback and chop B-class damage."
  - rscadd: "New crafting recipe for Daemonslayer, requires an anointed berserker sword which is crafted from glut harvested from dead gnolls, alongside the other uberrare loot the recipe already needed. Go kill gnoll players!"
  - balance: "Greataxe gains frontal arc Sweep at 1.1 damfactor with Massive clickCD"
  - balance: "Maul gains frontal arc Sweep with Glacial clickCD, loses Daze"
  - balance: "Axes cut damfactor increased to 1.3 (from 1.1), loses penfactor, clickCD increased in general"
  - balance: "Greatflail / Matthios Flail gain charged horizontal Sweep at 1.5 damfactor"
  - balance: "Bardiche gains Cleave and Sweep, loses gripped Chop. AOE intents are 2 tiles reach."
  - balance: "Glaive gains Sweep, thrust moved to bad thrust subtype (penfactor 20, no effective range). AOE intents are 2 tiles reach."
  - balance: "Naginata gains Sweep, loses Peel. AOE intent is 2 tile reach."
  - code_imp: "/obj/item/ingot/component types ported. Used in berserker sword and daemonslayer crafting"
  - qol: "Attack Speed display is now color-coded across six granular tiers (including new Extremely Sluggish and Glacial)"
  - qol: "Cleave examine shows max additional targets, living priority note, and diagonal pattern info"
  - image: "Intent icons split out to dedicated rogueintents.dmi. rather than being lumped into roguehud.dmi"
  - image: "draconic ingot and enduring ingot now have unique sprites rather than reusing recolored blacksteel and silver ingot icon states."