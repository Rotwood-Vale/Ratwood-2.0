author: "SirSwagmeyer"
delete-after: True
changes:
  - balance: "Swift Balance now requires the attacker to be wearing light armor to work."
  - balance: "Parrying with a Swift Balanced weapon while having nothing in the off-hand will give a small boost in defense."
  - balance: "Swift Balance's parry penalty now scales based on the targeting zone of the attacker. The harder it is to hit, the harder it is to defend against."
  - balance: "Dodge (with dodge expert) now dynamically changes its chances depending on how the combat is going."
  - balance: "Dodge stamina drain is now affected by swift stance attacks.\nbalance; Dodge now decays its chance at a faster rate if the attacker has higher weaponskill than the dodger."
  - balance: "Dodge now starts at 90% rather than 95%. Pity Dodge recovery from being struck can no longer exceed 85%."
  - balance: "Swift stance is now more effective vs dodge."
  - balance: "+2 speed statpacks have been adjusted to discourage the new minmaxing meta that will come with the rework"
  - balance: "Weapon Skill difference between the target and attacker is now more effective vs dodge. This currently does not apply to pure unarmed."
  - balance: "SPD difference between target and attacker is now more effective vs dodge."
  - qol: "10 SPD is now the minimum for dodge mechanics to fully function. (Down from 11)"
  - qol: "Dodging simple mobs with Dodge Expert is now easier."
  - bugfix: "Armor defines now cover the right limbs as intended."
  - bugfix: "Werewolf claws and urumi whips now have proper armor penetration values."
  - bugfix: "Actually readd the steel messer's unique rend intent (I made the intent but forgot to add it)"
  - bugfix: "Patches some runtime and sprite issues with dagger dash special"
  - balance: "Gave a slight boost to gorget's integrity, in lieu of all neck armor being unpeelable, now."
  - bugfix: "Fixed a bug issue with psydonic knuckles not being blessed or able to be blessed. It doesn't do anything else right now."
  - bugfix: "Fixed a bug that left frost sabre's FREEZE intent undefined on armor pen."