author: "zeroisthebiggay"
delete-after: True
changes:
  - qol: "Guard hotkey. Press G to guard, or assign it in the hotkeys menu if it's not already."
  - rscadd: "With Journeyman unarmed, you can guard while barehanded."
  - balance: "Guard expiring no longer has any form of penalty."
  - balance: "Forcefully and intentionally ending a guard via attacking or swapping hands now always incurs a harsh penalty. It previously did so specifically when you tried to shoot a crossbow, but now it applies to everything done by the person guarding. Let your guard expire instead of trying to end it early."
  - balance: "Disrupting a guard with a feint now incurs the stamina penalty of having your guard kicked or an item being thrown at you in addition to making you vulnerable."
  - balance: "You can guard while sprinting."
  - balance: "You can guard with mage armor."
  - balance: "You can no longer guard while exposed. This shouldn't affect being feinted, but being baited will leave you vulnerable and without the ability to counterattack. Don't get baited."