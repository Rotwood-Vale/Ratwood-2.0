author: "Yuckuza"
delete-after: True
changes:
  - rscadd: "Added psydonic volfskull and greatplumed psydonic armet"
  - balance: "Creed, stigmata, silver war axe, and psydonic war axe all have 25 force wielded or unwielded since they either pair with a shield or are forced one-handed."
  - balance: "Inspector Daybreak whip minstr changed to 11; Inspector Daybreak loadout now +1 STR/+1 PER"
  - rscadd: "Ordinator can now take stigmata and covenant, or covenant and a war axe. They also get a new studded leather cuirbolli vest underarmor and psydonic blacksteel chains in their mask slot."
  - rscadd: "Adjudicator can now take either +2 CON/+2 WIL and the psydonic haubrek or +2 INT/+2 PER and the psydonic cuirass. They also get access to the two new psydonic helms."
  - balance: "Confessor stats changed to AP values: 3 SPD, 3 WIL, 2 PER, -1 STR"
  - balance: "Arbalist stat weight changed from +10 to +9: 3 PER, 2 STR, 2 WIL"
  - balance: "Sojourner statweight changed from +1 to +7: 3 INT, 2 WIL, 1 SPD, 1 PER, -1 CON. (Same as Naledi Hiero -1 speed)"