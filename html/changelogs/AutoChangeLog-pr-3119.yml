author: "SirSwagmeyer"
delete-after: True
changes:
  - balance: "Unarmed base damage increased and now it scales linearly to your strength instead of quadratically"
  - balance: "Expert Pugilist now gives a flat +5 to unarmed damage. Protective gloves gives +1 to +3 (Leather to Plate), whereas unarmed bandages goes from +3, +5 to +7."
  - balance: "All knuckles are now a type of gloves. The good knuckels give +12 unarmed flat bonus, higher than bandage, but have disastrous durability and poor armor. They allow you to do unarmed parrying ,however."
  - balance: "Bandages now provide some protection to the hands."
  - balance: "Punch now deals 1.0 integrity damage once again, and calculate as swift balanced like unarmed weapons."
  - bugfix: "unarmed now properly lowers sharpness"
  - bugfix: "strong intent now benefits unarmed"
  - bugfix: "unarmed fails riposte if they punch during it"
  - bugfix: "punches now give dodge back on hits to skin"
  - bugfix: "fixes unarmed not pausing skinarmor regen"
  - bugfix: "feint cares about unarmed now (no free +60% to being feinted)"
  - bugfix: "bracers/knuckles now take damage properly when parrying with unarmed"
  - balance: "stomps have 100% accuracy again"
  - balance: "swift/strongcost for unarmed 1.5 -> 6"
  - balance: "misscost for unarmed 3 -> 1"
  - balance: "katar cut 1.3 -> 1.2. katar clickdelay for both intents 8 -> 10"
  - balance: "grab cost reduced to account for swiftcost adjustment"
  - balance: "riposting unarmed grants normal riposte counter"