author: "hugmeorelse"
delete-after: True
changes:
  - rscadd: "Feeling cute. Added some IC way to explain how to use the fulemnor chair, because I keep seeing new players get stumped without breaking OOC. Might delete later."
  - rscadd: "A severed head can be sewn onto a new body and bound to it in a Fulmenor chair. Takes a master physician and a full tank of elixir. Takes on the head's identity."
  - rscadd: "Bodies whose brain isn't their own refuse ordinary revival."
  - rscadd: "Deadite NPCs can infect you with their bite."
  - qol: "Searching now points out severed heads lying loose, not just bodies."
  - bugfix: "Curing a deadite (typically through admin revival) no longer leaves them permanently non-organic and unable to ever rot, rise or be infected again."
  - bugfix: "Decapitated deadites can be cured."
  - bugfix: "Curing a deadite now actually restores the body instead of leaving it undead while claiming to be cured."
  - bugfix: "Burying a deadite in a grave or coffin no longer deletes the body."
  - bugfix: "Headless deadite corpses are no longer deleted."
  - bugfix: "Players inhabiting an NPC body are no longer despawned (in theory)."
  - bugfix: "Corpses waiting to rise as a deadite can ghost once the rise clearly isn't coming, and admin-ghosting always works."
  - bugfix: "Deadite Seek Brains no longer says it smelled nothing when someone is standing on top of you."
  - bugfix: "Tongue surgery looks for tongue wounds instead of ear wounds."
  - bugfix: "Improvised scalpels work for plastic surgery again."
  - admin: "List Severed Heads tool for admins"