author: "KeberosNihilus"
delete-after: True
changes:
  - rscadd: "Arcyne Blindness - A variant of Blindness that scales on Arcane skill. Longer CD, requires a Naledian psycross to use."
  - bugfix: "Adjusted some text regarding the Pontifex. Makes some of what they need clearer and it should read better."
  - balance: "Pontifex now has 4 Spellpoints but still only T1 spells."
  - balance: "Pontifex no longer has Ensnare by default."
  - balance: "Pontifex now has 4 'Paths' (subclasses) to choose from."
  - rscadd: "Path of War - Air Blade (sidegrade to Arcane Bolt) and Enchant Weapon. Enchant Weapon can't be used on your Push Dagger, but is deadly if applied to a pair of knuckles."
  - rscadd: "Path of Control - Ensnare and Greater Forcewall. Heavy focus on CC and battlefield control."
  - rscadd: "Path of Shadows - Lesser Knock, Invisibility, and Arcane Blindness. Heavy focus on trickery and shadows."
  - rscadd: "Path of Survival - Increases your Medicine, Cooking, Athletics, and Swimming skills. Also gives you Secular Diagnosis. Sovl and lets you bodyguard or run around like a punch-dagger wielding maniac better."