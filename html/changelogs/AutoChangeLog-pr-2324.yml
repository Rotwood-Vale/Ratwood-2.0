  - admin: "Deaths, dismemberment, critical wounds, critical knockouts, dodges and parries are now logged"
  - admin: "Attacks record the zone that was aimed at"
  - admin: "Typing indicator entries record why typing stopped and no longer go into the attack log file (partially works)"
  - bugfix: "Fixed shove logs printing their description in the weapon slot"
  - bugfix: "sanitized inputs further and addressed some issues involving html encoding with logs"
  - code_imp: "Certain log entries are stored as structured dict-like values instead of unstructured strings"