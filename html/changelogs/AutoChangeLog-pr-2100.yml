author: "zoktiik"
delete-after: True
changes:
  - refactor: "Significantly modified the branding iron's code for more clarity in control flow."
  - code_imp: "Made examine code not iterate thru the target's bodyparts if they have not been branded at all."
  - qol: "Using the branding iron on someone now immediately shows you a prompt asking where to mark, instead of making you wait for the do_after to make your (very awkwardly-timed) decision."
  - qol: "The Crude Branding Stick (loadout item) can now be used on someone else if they are in compliance mode, regardless of conscious state."
  - bugfix: "The zone you selected to brand (on the targeting doll) & the branding description you wrote are now cached when using the iron on someone, making them impossible to change midway through."
  - rscadd: "Added Facial (head [not neck]) and Sensitive (genitalia, breasts [not chest]) Branding preferences, default off. When disabled, they will prevent someone else from branding you there."
  - rscadd: "The stomach area can now be branded. Why not."