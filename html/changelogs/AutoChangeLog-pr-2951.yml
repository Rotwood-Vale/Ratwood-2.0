author: "KurobaKetsukane"
delete-after: True
changes:
  - rscadd: "Knightly Journey knights and squires now pick a subclass (Banneret/Outrider, Squire-at-Arms/Hobelar/Bidower)"
  - rscadd: "The Knightly Journey can bring an optional chaplain (Sworn Missionary or Sworn Stigmata) and up to two followers (Chirurgeon, Jongleur, Servitor, Campwright)"
  - rscadd: "The Unknightly Journey is now a proper special migrant wave, and the Dark Itinerant and Varlet can serve any Ascendant"
  - rscadd: "Dark Itinerants and Varlets now pick a subclass (Forsworn Knight/Knight Harbinger, Blackguard/Stablehand/Harrier)"
  - rscadd: "The Unknightly Journey can bring an optional Wordbearer"
  - rscadd: "Dark Itinerants get minor miracles from their god"
  - rscadd: "Heartfelt lords, hands and knights can take a Heartfelt caparison from their stash"
  - balance: "Dark Itinerants start in plain steel instead of blacksteel, and a ritualist of the same god can give them their god's armor through the armor rite"
  - rscdel: "Removed the Dark Itinerant's mindlink, squire recruit spell and objectives"
  - bugfix: "Zizo's inverted psycross can now be worn in the ring slot like the other Ascendant amulets"