author: "Yuckuza"
delete-after: True
changes:
  - rscadd: "Added 12 new drow weapons available to drow mercs and drow adventurers"
  - rscadd: "3 new drow armor pieces, a light armor vest and two helms"
  - rscadd: "New drow-exclusive adventurer class Crocs de l'araignée Débroussaillage that gets journeyman skills + drow-specific gear"
  - rscadd: "The drider mount can now climb up a single z-level by clicking with an empty hand on a wall (as you would with normal climbing)"
  - rscadd: "Driders now have natural armor barding with brigandine stats and a lengthy 40-second regen time per 20% integ."
  - balance: "Drow merc men gender stats changed from -1 STR, +1 LCK -> -1 STR/LCK, +1 SPD/WIL. You're unlucky to be a drow male, but extra beatings have made you more resilient."
  - qol: "Drow mercs now summon their drider via a snowflaked TRAIT_SPIDERBORN spell that works like saddleborn but exclusively for Driders. Driders do not suffer the same dangerous area penalties as regular mounts; they are underdark apex predators after all."
  - refactor: "Disarm intent now functions with any rogue weapon, not just the hooksword. Uses shared logic rather than an on_attack override duplicated per weapon with the intent."
  - bugfix: "Changed the backend of drow merc pre_equip(), far less prone to deleting your items during loadout selection."
  - sound: "Drow merc combat music swapped to \"Tsukasa Saitoh - Bloodborne (Original Soundtrack) - Darkbeast\". Old combat track selectable under the name \"Drow Classic\""