author: "zeroisthebiggay"
delete-after: True
changes:
  - rscadd: "Quirks! Essentially lesser virtues unlocked by having additional vices. They typically provide very little mechanical benefit, but contain some neat ways to give your character some extra flavor."
  - rscdel: "Ugly virtue. It was already a vice, and dead nose has been reworked into a quirk."
  - rscdel: "Second Voice virtue. It's been reworked into a quirk."
  - rscdel: "Nobility virtue. It's been reworked into a quirk."
  - rscdel: "High Society virtue. It's been made redundant and is now dead."
  - rscdel: "Acquired Tastes virtue. It's been atomized into the Acquired Tastes and Rough Lover quirks."
  - rscdel: "Annoying Voice, Malodorous, Marked by Gnolls, Marked for Death Scarred, and Ugly vices. They've all been reworked into quirks. !!!!!If you were using these before MAKE SURE THEY'RE SELECTED!!!!!"
  - balance: "Those granted nobility from the noble quirk are considered minor nobles."
  - balance: "Minor nobles and foreign nobles are subjected to the poll tax."
  - refactor: "Redid some backend code on how virtues are handled, enabling proper restrictions for incompatible vices and such."
  - code_imp: "No Vice is no longer selectable as a vice. Now you have to clear all your other vices and then clear your first vice slot in order to have No Vice."